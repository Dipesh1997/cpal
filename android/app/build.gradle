plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
android {
    namespace = "com.color.paletteasian"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.color.paletteasian"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Limit native ABIs in release to reduce bundle size
    defaultConfig {
        // ndk {
        //     abiFilters "arm64-v8a", "armeabi-v7a"
        // }
        // If your app supports only English, keep just 'en' resources to shrink size.
        // resConfigs "en"
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.activity:activity-ktx:1.9.3'
            force 'androidx.activity:activity:1.9.3'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Add WebView dependency
    implementation "androidx.webkit:webkit:1.8.0"
    // Use Play Feature Delivery APIs instead of deprecated Play Core
    implementation "com.google.android.play:feature-delivery:2.1.0"
    // Provide Play Core classes at compile time only to satisfy R8 (not packaged in AAB)
    compileOnly "com.google.android.play:core:1.10.3"
    // Remove all custom dependencies - let Flutter manage them
    // implementation "androidx.annotation:annotation:1.5.0"
    // implementation "io.flutter:flutter_embedding_debug:1.0.0-3316dd8728"
    // implementation "io.flutter.plugins.sharedpreferences:shared_preferences_android:1.0.0"
    implementation "androidx.activity:activity-ktx:1.9.3"
}
