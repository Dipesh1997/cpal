<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/icon.png">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Color Palette</h1>
            <button id="favorites-button" class="icon-button">
                <span class="material-icons">star</span>
            </button>
        </header>
        
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search by name or number">
            <span class="material-icons search-icon">search</span>
        </div>
        
        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-button active" data-category="light">Light</button>
                <button class="tab-button" data-category="medium">Medium</button>
                <button class="tab-button" data-category="dark">Dark</button>
                <button class="tab-button" data-category="opus">Opus</button>
            </div>
        </div>
        
        <div id="opus-subtabs" class="subtabs-container" style="display: none;">
            <div class="subtabs">
                <button class="subtab-button active" data-prefix="All">All</button>
                <!-- Subtabs will be added dynamically -->
            </div>
        </div>
        
        <div class="content-container">
            <div id="colors-grid" class="colors-grid"></div>
            <div id="loading-indicator" class="loading-indicator">
                <div class="spinner"></div>
            </div>
        </div>
    </div>
    
    <div id="color-detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-color-name"></h2>
                <div class="modal-actions">
                    <span id="modal-page-number" class="page-number"></span>
                    <button id="modal-favorite-button" class="icon-button">
                        <span class="material-icons">star_border</span>
                    </button>
                    <button id="modal-close-button" class="icon-button">
                        <span class="material-icons">close</span>
                    </button>
                </div>
            </div>
            <div id="modal-color-display" class="color-display">
                <div class="color-info">
                    <h3 id="modal-color-name-display"></h3>
                    <p id="modal-color-details"></p>
                </div>
            </div>
        </div>
    </div>
    
    <div id="favorites-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Favorites</h2>
                <button id="favorites-close-button" class="icon-button">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div id="favorites-grid" class="colors-grid"></div>
            <div id="no-favorites" class="no-content" style="display: none;">
                <p>No favorites added yet.</p>
            </div>
        </div>
    </div>

    <!-- Load the colors data first -->
    <script src="data/colors-data.js"></script>
    <script src="lib/color-detail.js"></script>
    <script src="script.js"></script>
</body>
</html>
