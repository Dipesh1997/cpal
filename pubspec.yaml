name: paletteasian
description: Asian Paints Color Palette
publish_to: 'none'
version: 1.0.47+47

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.1
  flutter_colorpicker: ^1.1.0
  expandable: ^5.0.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  google_mobile_ads: ^6.0.0
  showcaseview: ^3.0.0
  package_info_plus: ^8.0.0

  vector_math: any
  http: any
  image: ^4.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/
