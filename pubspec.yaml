name: paletteasian
description: Asian Paints Color Palette
publish_to: 'none'
version: 1.0.18+18

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  flutter_colorpicker: ^1.0.3
  expandable: ^5.0.1
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.2
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/colors.json
